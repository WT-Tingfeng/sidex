<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SideX</title>
		<script>
			// VS Code globals — must be set before any module loads
			globalThis._VSCODE_FILE_ROOT = window.location.origin + '/src/';
			globalThis._VSCODE_NLS_LANGUAGE = localStorage.getItem('vscode.nls.locale') || 'en';
			globalThis._VSCODE_NLS_MESSAGES = [];

			globalThis.__SIDEX_TAURI__ = true;
			try {
				const ua = navigator.userAgent || '';
				const plat = navigator.platform || '';
				if (ua.includes('Mac') || plat.includes('Mac')) {
					globalThis.__SIDEX_ARCH__ = 'arm64';
					try {
						const gl = document.createElement('canvas').getContext('webgl');
						const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
						const renderer = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '';
						if (renderer && /Intel/i.test(renderer) && !/Apple/i.test(renderer)) {
							globalThis.__SIDEX_ARCH__ = 'x64';
						}
					} catch (_) {}
				} else {
					globalThis.__SIDEX_ARCH__ = 'x64';
				}
			} catch (_) {
				globalThis.__SIDEX_ARCH__ = 'x64';
			}
			globalThis._VSCODE_PACKAGE_JSON = { version: '1.110.0', name: 'sidex' };
			globalThis._VSCODE_PRODUCT_JSON = {
				nameShort: 'SideX',
				nameLong: 'SideX',
				applicationName: 'sidex',
				dataFolderName: '.sidex',
				urlProtocol: 'sidex',
				version: '1.110.0',
				commit: '',
				date: new Date().toISOString(),
				quality: 'stable',
				reportIssueUrl: 'https://github.com/sidenai/sidex/issues/new',
				licenseName: 'MIT',
				licenseUrl: 'https://github.com/sidenai/sidex/blob/main/LICENSE',
				extensionsGallery: {
					serviceUrl: 'https://marketplace.siden.ai/api/gallery',
					itemUrl: 'https://open-vsx.org/vscode/item',
					resourceUrlTemplate: 'https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}',
					controlUrl: '',
					nlsBaseUrl: 'https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/extension',
					publisherUrl: ''
				}
			};
		</script>
		<script>
		</script>
		<script src="/builtin-extensions.js"></script>
		<script type="module" src="/src/main.ts" defer></script>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background-color: #111111;
				color: #c0c0c0;
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Fira Sans', 'Droid Sans',
					'Helvetica Neue', sans-serif;
				font-size: 13px;
			}

			#sidex-splash {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 12px;
				background-color: #111111;
				pointer-events: none;
				opacity: 1;
				transition: opacity 0.12s ease-out;
			}

			#sidex-splash.sidex-splash-hiding {
				opacity: 0;
			}

			#sidex-splash .sidex-splash-wordmark {
				font-size: 36px;
				font-weight: 600;
				letter-spacing: 0.04em;
				color: #e7e7e7;
				-webkit-user-select: none;
				user-select: none;
			}

			#sidex-splash .sidex-splash-wordmark span {
				color: #4daafc;
			}

			#sidex-splash .sidex-splash-status {
				font-size: 13px;
				letter-spacing: 0.08em;
				color: #8c8c8c;
				-webkit-user-select: none;
				user-select: none;
			}

			@media (prefers-reduced-motion: no-preference) {
				#sidex-splash .sidex-splash-status {
					animation: sidex-splash-pulse 1.6s ease-in-out infinite;
				}
			}

			@keyframes sidex-splash-pulse {
				0%,
				100% {
					opacity: 0.45;
				}
				50% {
					opacity: 1;
				}
			}
		</style>
	</head>
	<body aria-label="">
		<!-- Startup splash. Inline and dependency-free on purpose: the HTML
		     itself paints the dark frame, so the window never shows an empty
		     black rectangle while the workbench bundle loads. src/main.ts
		     fades it out once the workbench has mounted; the inline timer
		     below removes it even if the entry module fails to load. -->
		<div id="sidex-splash" role="presentation" aria-hidden="true">
			<div class="sidex-splash-wordmark">Side<span>X</span></div>
			<div class="sidex-splash-status">正在启动…</div>
		</div>
		<script>
			setTimeout(function () {
				var splash = document.getElementById('sidex-splash');
				if (splash) {
					splash.remove();
				}
			}, 15000);
		</script>
	</body>
</html>
