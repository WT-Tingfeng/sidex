name: Build SideX 0.1.5 (Windows, unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label
        required: true
        default: "0.1.5"

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Setup MinGW (CGO)
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build sidex-server.exe
        shell: pwsh
        working-directory: sidexai/sidex-server
        env:
          CGO_ENABLED: '1'
        run: |
          go build -tags fts5 -o sidex-server.exe ./cmd/server
          Copy-Item sidex-server.exe ../../src-tauri/sidex-server.exe -Force
          Get-Item ../../src-tauri/sidex-server.exe | Format-List Length,Name

      - name: Setup built-in extensions
        shell: bash
        run: bash scripts/setup-extensions.sh

      - name: Install frontend dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: npm run build

      - name: Build Tauri app (unsigned)
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find target -type f \( -name "*-setup.exe" -o -name "*.msi" \) -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          ls -la dist-artifacts/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidex-${{ inputs.version }}-windows-x64
          path: dist-artifacts/
          if-no-files-found: warn
          retention-days: 14
