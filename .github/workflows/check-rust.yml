name: Check Rust (compile only, no installer)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder sidex-server.exe
        shell: pwsh
        run: New-Item -ItemType File -Force src-tauri/sidex-server.exe | Out-Null

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: check-windows

      - name: cargo check (src-tauri + workspace deps)
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: cargo test -p sidex-settings
        run: cargo test -p sidex-settings --target x86_64-pc-windows-msvc
