name: Build SideX 0.1.3 macOS (unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label for artifacts
        required: true
        default: "0.1.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: macos-arm64
          - target: x86_64-apple-darwin
            artifact: macos-x64
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup built-in extensions
        shell: bash
        run: bash scripts/setup-extensions.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: npm run build

      - name: Build Tauri app (unsigned)
        run: npx tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find target -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) -exec cp {} dist-artifacts/ \; 2>/dev/null || true
          ls -la dist-artifacts/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidex-${{ inputs.version }}-${{ matrix.artifact }}
          path: dist-artifacts/
          if-no-files-found: warn
          retention-days: 14
